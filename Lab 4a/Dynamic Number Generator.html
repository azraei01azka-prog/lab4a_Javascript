<!DOCTYPE html>
<html>
<body>

  <h1>Dynamic Number Generator</h1>
<button id="generateBtn" type="button">Generate</button>
<ol id="numberList"></ol>

<script>
function generateNumbers() {
  var list = document.getElementById("numberList");
  list.textContent = "";

  for (var i = 1; i <= 5; i++) {
    var li = document.createElement("li");
    li.textContent = "The number is " + i;
    list.appendChild(li);
  }
}

document.getElementById("generateBtn").addEventListener("click", generateNumbers);
</script>

</body>
</html>
