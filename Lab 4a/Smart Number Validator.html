<!DOCTYPE html>
<html>
<body>

  <h1> Smart Number Validator  </h1>
<label for="userInput">Enter a number:</label>
<input type="text" id="userInput" placeholder="Enter a number">
<button id="checkBtn" type="button">Check</button>
<p id="result" role="status" aria-live="polite"></p>

<script>
function checkInput() {
  var text = document.getElementById("userInput").value.trim();
  var number = Number(text);

  if (text === "" || isNaN(number)) {
    document.getElementById("result").textContent = "Please enter a valid number!";
  } else if (number < 10) {
    document.getElementById("result").textContent = "The number is lower than 10";
  } else if (number > 10) {
    document.getElementById("result").textContent = "The number is higher than 10";
  } else {
    document.getElementById("result").textContent = "The number is equal to 10";
  }
}

document.getElementById("checkBtn").addEventListener("click", checkInput);
</script>

</body>
</html>
